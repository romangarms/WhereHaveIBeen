schema: spec-driven

context: |
  All geometry and stats are computed server-side by the separate
  WhereHaveIBeen-API repo (/api/me/*, /api/aggregate-roads). Clients (Flask web
  app, ios/, android/) only render; a change that needs new data is an API
  change first.
  The Flask app keeps no database; identity is the OwnTracks account behind
  HTTP Basic / the session cookie.
  The iOS app is the reference for the native apps: android/ ports its screens
  and behaviour, so changes to one native client should say whether the other
  follows.
  Other contributors (main is maintained by Roman Garms) change the design
  frequently; branch from current main and check its CLAUDE.md before
  proposing.

